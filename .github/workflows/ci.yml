name: Email Organizer CI & Synthetic Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run Unit Tests (Pytest)
        run: |
          pytest tests/

      - name: Execute Full 550 Benchmark Synthetic Quality Gate
        run: |
          python run_tests.py --mode=rules --suite=all --quality-gate --output-dir=reports

      - name: Upload Statistical & HTML Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-organizer-qa-reports
          path: reports/
